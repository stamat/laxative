name: Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight: killing deploy-pages mid-run leaves the
# deployment queued on GitHub's side, and the next run then sits in
# `deployment_queued` until it times out. Queued runs are skipped instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: script/bootstrap
      - name: Build docs
        run: script/build --base-url /${{ github.event.repository.name }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
